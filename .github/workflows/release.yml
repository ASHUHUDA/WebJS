name: Release cloud-drive-renamer

on:
  push:
    tags:
      - 'cloud-drive-renamer-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-云盘重命名
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 01-云盘重命名/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            01-云盘重命名/dist/cloud-drive-renamer.user.js
            01-云盘重命名/dist/cloud-drive-renamer.meta.js
